<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Carreira - Eduardo Barratella</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 1.1rem;
    }

    .galeria-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      width: 100%;
    }

    .card-pasta {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, border-color 0.3s ease;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card-pasta:hover {
      transform: translateY(-8px);
      border-color: #38bdf8;
    }

    .imagem-wrapper {
      width: 100%;
      height: 320px;
      overflow: hidden;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .imagem-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .imagem-wrapper img.imagem-contida {
      object-fit: contain;
      background-color: #fff;
    }

    .card-pasta:hover .imagem-wrapper img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-tag {
      align-self: flex-start;
      background-color: #0284c7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-info h2 {
      font-size: 1.1rem;
      color: #f8fafc;
      line-height: 1.4;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-conteudo {
      background-color: #1e293b;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #38bdf8;
      position: relative;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-imagem-wrapper {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 60vh;
    }

    .modal-imagem-wrapper img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }

    .modal-texto {
      padding: 20px;
      overflow-y: auto;
    }

    .modal-texto h3 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .modal-texto p {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 1rem;
    }

    .fechar-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    .fechar-modal:hover {
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      
      .imagem-wrapper {
        height: 250px;
      }
    }
  </style>
</head>
<body class="vw-body">

  <header>
    <h1>Eduardo Barratella</h1>
    <p>Trajetória no Futebol & Futsal</p>
  </header>

  <main class="galeria-container">

    <!-- Foto 1 -->
    <article class="card-pasta" onclick="abrirModal('BID.jpg', 'Oficialização no BID', 'Momento oficial em que fui inscrito no BID (Boletim Informativo Diário da CBF) atuando pelo Foz. A publicação no BID garante a regularização formal do atleta para disputar partidas oficiais por competições do futebol brasileiro.')">
      <div class="imagem-wrapper">
        <img class="imagem-contida" src="BID.jpg" alt="Oficialização no BID">
      </div>
      <div class="card-info">
        <span class="card-tag">Registro</span>
        <h2>Oficialização no BID</h2>
      </div>
    </article>

    <!-- Foto 2 -->
    <article class="card-pasta" onclick="abrirModal('E.jpg', 'Estreia na Argentina', 'Minha estreia na Argentina contra a equipe do Sportivo Trinidense. Entrei em campo no segundo tempo atuando na lateral direita, fiz 1 gol na partida e ajudando a fechar a vitória por 2x1 a favor do Foz.')">
      <div class="imagem-wrapper">
        <img src="E.jpg" alt="Estreia na Argentina">
      </div>
      <div class="card-info">
        <span class="card-tag">Internacional</span>
        <h2>Estreia na Argentina</h2>
      </div>
    </article>

    <!-- Foto 3 -->
    <article class="card-pasta" onclick="abrirModal('11.jpg', 'Ensaio do Media Day', 'Registro feito durante o Media Day. No futebol profissional e de base, o Media Day é um dia dedicado para fotos oficiais, vídeos promocionais e materiais de imprensa que os clubes utilizam nas redes sociais e transmissões ao longo da temporada.')">
      <div class="imagem-wrapper">
        <img src="11.jpg" alt="Media Day">
      </div>
      <div class="card-info">
        <span class="card-tag">Apresentação</span>
        <h2>Ensaio do Media Day</h2>
      </div>
    </article>

    <!-- Foto 4 -->
    <article class="card-pasta" onclick="abrirModal('00.jpg', '3º Jogo e Camisa 10', 'Vestindo a camisa 10 no Estádio do ABC, em Foz do Iguaçu, na partida válida pela Copa Paraná contra o Cascavel. Joguei os 90 minutos do confronto, que terminou em 1x1, sofrendo o pênalti que originou o gol do Foz.')">
      <div class="imagem-wrapper">
        <img src="00.jpg" alt="Camisa 10 no Estádio do ABC">
      </div>
      <div class="card-info">
        <span class="card-tag">Marca Histórica</span>
        <h2>3º Jogo e Camisa 10</h2>
      </div>
    </article>

    <!-- Foto 5 -->
    <article class="card-pasta" onclick="abrirModal('77.jpg', 'Campeonato Paranaense Sub-17', 'Confronto em Campo Mourão contra o Pato Futsal pelo Campeonato Paranaense Sub-17. Apesar do placar adverso de 4x2 para o adversário, mantive uma ótima atuação individual dentro de quadra.')">
      <div class="imagem-wrapper">
        <img src="77.jpg" alt="Paranaense Sub-17 de Futsal">
      </div>
      <div class="card-info">
        <span class="card-tag">Futsal</span>
        <h2>Campeonato Paranaense Sub-17</h2>
      </div>
    </article>

    <!-- Foto 6 -->
    <article class="card-pasta" onclick="abrirModal('chu.jpg', 'Semifinal da Copa Paraná', 'Partida decisiva pela semifinal da Copa Paraná, realizada na cidade de Cambé.')">
      <div class="imagem-wrapper">
        <img src="chu.jpg" alt="Semifinal da Copa Paraná em Cambé">
      </div>
      <div class="card-info">
        <span class="card-tag">Decisão</span>
        <h2>Semifinal da Copa Paraná</h2>
      </div>
    </article>

  </main>

  <div id="meuModal" class="modal" onclick="fecharModalFora(event)">
    <div class="modal-conteudo">
      <span class="fechar-modal" onclick="fecharModal()">&times;</span>
      <div class="modal-imagem-wrapper">
        <img id="modalImg" src="" alt="Imagem ampliada">
      </div>
      <div class="modal-texto">
        <h3 id="modalTitulo"></h3>
        <p id="modalDescricao"></p>
      </div>
    </div>
  </div>

  <!-- PLUGIN VLIBRAS -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <!-- FIM DO PLUGIN -->

  <script>
    function abrirModal(imagemSrc, titulo, descricao) {
      document.getElementById('modalImg').src = imagemSrc;
      document.getElementById('modalTitulo').innerText = titulo;
      document.getElementById('modalDescricao').innerText = descricao;
      document.getElementById('meuModal').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('meuModal').style.display = 'none';
    }

    function fecharModalFora(event) {
      if (event.target.id === 'meuModal') {
        fecharModal();
      }
    }
  </script>

</body>
</html>
